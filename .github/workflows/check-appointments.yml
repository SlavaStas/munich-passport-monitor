name: Munich passport appointments
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: Режим запуска
        type: choice
        options: [dry-run, monitor, telegram-test]
        default: dry-run

permissions: {}
concurrency:
  group: munich-passport-monitor
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'monitor'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: inputs.mode != 'telegram-test'
        run: |
          npm run typecheck
          npm run lint
          npm test
          npx --no-install playwright install --with-deps chromium --only-shell
          npm run test:browser
          npm run check
      - if: inputs.mode == 'telegram-test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node dist/index.js --telegram-test

  monitor:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.mode == 'monitor')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check notification configuration
        env:
          BOT_SET: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          CHAT_SET: ${{ secrets.TELEGRAM_CHAT_ID != '' }}
        run: |
          if [[ "$BOT_SET" != true || "$CHAT_SET" != true ]]; then
            echo "::error::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium --only-shell
      - name: Prepare state branch
        run: |
          export STATE_DIR="$RUNNER_TEMP/munich-state"
          echo "STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"
          bash scripts/prepare-state.sh
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start
